spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.security.require-https=true
app.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USER:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# O Tomcat le X-Forwarded-For da direita para a esquerda e so confia em saltos de proxies
# conhecidos; o primeiro IP enviado pelo cliente nao e mais aceito como endereco real.
# Proxies confiaveis: padrao do Spring Boot (10/8, 172.16/12, 192.168/16, 169.254/16, 127/8, ::1, fc00::/7).
# Se o balanceador da hospedagem usar outro endereco, defina SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.shutdown=graceful
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

spring.ai.openai.api-key=${IA_CHAVE_API:${GROQ_API_KEY}}
