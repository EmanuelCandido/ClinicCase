spring.application.name=SistemaCrud

# Sem perfil explicito a aplicacao sobe em prod e exige segredos reais.
# Para desenvolvimento local use SPRING_PROFILES_ACTIVE=dev.
spring.profiles.default=prod
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

app.security.jwt.expiration-minutes=30
app.security.jwt.remember-me-minutes=${JWT_REMEMBER_ME_MINUTES:1440}
app.security.login.max-attempts=5
app.security.login.lock-minutes=15
app.docs.public=false
app.cors.allowed-origins=

spring.ai.openai.api-key=${IA_CHAVE_API:${GROQ_API_KEY:}}
spring.ai.openai.base-url=${IA_URL_BASE:${GROQ_BASE_URL:http://127.0.0.1:3001/v1}}
spring.ai.openai.chat.model=${IA_MODELO:${GROQ_MODEL:auto}}
# Ordem de preferencia por operacao (separada por virgula). O proximo modelo so e usado quando o
# provedor recusa o anterior (modelo inexistente, sem cota ou erro HTTP). O ultimo item volta ao IA_MODELO.
app.ia.modelos.caso=${IA_MODELOS_CASO:gpt-oss-120b,gpt-oss-20b,nemotron-3-super-120b-a12b,gemini-3.5-flash-lite,ministral-14b-latest,${spring.ai.openai.chat.model}}
app.ia.modelos.perguntas=${IA_MODELOS_PERGUNTAS:gpt-oss-120b,gpt-oss-20b,nemotron-3-super-120b-a12b,gemini-3.5-flash-lite,ministral-14b-latest,${spring.ai.openai.chat.model}}
spring.ai.openai.chat.temperature=${IA_TEMPERATURA:${GROQ_TEMPERATURE:0.2}}
spring.ai.openai.chat.max-tokens=${IA_MAXIMO_TOKENS_SAIDA:4000}
spring.ai.openai.timeout=${IA_TEMPO_LIMITE:60s}
spring.ai.openai.max-retries=${IA_MAXIMO_TENTATIVAS_HTTP:0}

# Cotas por usuario e vagas simultaneas de IA. Desligue apenas em testes locais (IA_LIMITES_HABILITADOS=false).
app.ia.limites-habilitados=${IA_LIMITES_HABILITADOS:true}
app.ia.limite-por-minuto=${IA_LIMITE_POR_MINUTO:5}
app.ia.limite-por-dia=${IA_LIMITE_POR_DIA:20}
app.ia.maximo-simultaneas=${IA_MAXIMO_SIMULTANEAS:3}
# Contas compartilhadas sem cota por minuto/dia (separadas por virgula); a vaga simultanea continua valendo.
app.ia.usuarios-sem-limite=${IA_USUARIOS_SEM_LIMITE:}
# Retencao do ledger idempotente; apos esse prazo a mesma chave e reinicializada, sem apagar registros.
app.ia.idempotencia.ttl=${IA_IDEMPOTENCIA_TTL:1h}
# Autocadastro de professores para demonstracoes. Desligado por padrao; exige codigo de convite.
app.demo.cadastro.habilitado=${DEMO_CADASTRO_HABILITADO:false}
app.demo.cadastro.validade=${DEMO_VALIDADE:3d}
app.demo.cadastro.maximo-contas=${DEMO_MAXIMO_CONTAS:100}
app.demo.cadastro.maximo-cadastros-por-ip=${DEMO_MAXIMO_CADASTROS_POR_IP:0}
app.http.limite-corpo-bytes=${HTTP_LIMITE_CORPO_BYTES:1048576}

spring.jackson.factory.constraints.read.max-document-length=${HTTP_LIMITE_CORPO_BYTES:1048576}
spring.jackson.factory.constraints.read.max-string-length=262144
spring.jackson.factory.constraints.read.max-nesting-depth=100
spring.jackson.factory.constraints.read.max-token-count=10000
